[package]
name = "copilot-tauri"
version = "0.1.0"
edition = "2021"
description = "Window around the meeting copilot engine"

[build-dependencies]
tauri-build = "2"

[dependencies]
anyhow = "1"
copilot-core = { path = "../copilot-core" }
tauri = "2"

[features]
default = []

# Run recognition on the GPU. Passes straight through to copilot-core.
cuda = ["copilot-core/cuda"]
